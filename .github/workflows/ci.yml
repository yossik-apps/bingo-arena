name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      # the web packages come first: supabase/tests/bundle-split.test.ts builds a client with them (skipped without them)
      - run: npm --prefix web install
      - run: npm test
      - run: npm run build
